name: Verify Creative OS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Creative OS continuity
        run: python scripts/verify_creative_os.py

      - name: Verify Ginseng D-05 Decision Lineage
        run: python scripts/verify_ginseng_d05_lineage.py

      - name: Verify Ginseng D-09 final D0 closure
        run: python scripts/verify_ginseng_d09_d0_closure.py

      - name: Verify Ginseng D0 Human acceptance
        run: python scripts/verify_ginseng_d0_human_acceptance.py

      - name: Verify COS ownership/state/continuity Human acceptance
        run: python scripts/verify_cos_ownership_state_continuity_acceptance.py
